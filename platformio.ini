; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_src_flags = 
	-Werror
	-Wall
lib_deps = 
	https://github.com/adafruit/RadioHead.git
	https://github.com/tonton81/Circular_Buffer.git
	adafruit/Adafruit BNO08x@^1.2.5

; Bench target: builds the same sources for a Nucleo-L152RE with nothing wired
; up but the ST-LINK's USB virtual COM port. Radio and IMU default off so
; Drone::startup() reaches SAFE instead of faulting on absent hardware.
[env:nucleo_l152re]
platform = ststm32
board = nucleo_l152re
framework = arduino
; Applies to the core too, not just src/, because Serial.cpp is what sizes the
; ring buffer. The stock 64 is smaller than this protocol's largest frame (69),
; which silently wedges the tx queue - see the static_assert in usb.cpp.
build_flags = 
	-DSERIAL_TX_BUFFER_SIZE=256
	-DSERIAL_RX_BUFFER_SIZE=256
extra_scripts = pre:scripts/stm32_skip_rh_ask.py
build_src_flags = 
	-Werror
	-Wall
	-include platform.h
	-DDEFAULT_RADIO_ENABLED=false
	-DDEFAULT_GYRO_ENABLED=false
lib_deps = 
	https://github.com/adafruit/RadioHead.git
	https://github.com/tonton81/Circular_Buffer.git
	adafruit/Adafruit BNO08x@^1.2.5
