; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_src_flags = 
	-Werror
	-Wall
lib_deps = 
	https://github.com/adafruit/RadioHead.git
	https://github.com/tonton81/Circular_Buffer.git
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit NeoPixel@^1.15.5

[env:nucleo_l152re]
platform = ststm32
board = nucleo_l152re
framework = arduino
build_flags = 
	-DSERIAL_TX_BUFFER_SIZE=256
	-DSERIAL_RX_BUFFER_SIZE=256
extra_scripts = pre:scripts/stm32_skip_rh_ask.py
build_src_flags = 
	-Werror
	-Wall
	-include platform.h
	-DDEFAULT_RADIO_ENABLED=false
	-DDEFAULT_GYRO_ENABLED=false
lib_deps = 
	https://github.com/adafruit/RadioHead.git
	https://github.com/tonton81/Circular_Buffer.git
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit NeoPixel@^1.15.5
